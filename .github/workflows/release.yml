name: Release Latest WeCom

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for update and download
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: Commit and push updated VERSIONS.md
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSIONS.md
          git commit -m "docs: auto-update VERSIONS.md to ${{ steps.check.outputs.version }} [skip ci]" || true
          git push

      - name: Publish new version release
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" "${{ steps.check.outputs.artifact }}" \
            --title "WeCom Windows Version ${{ steps.check.outputs.version }}" \
            --notes-file build/releaseNote.md \
            --latest
